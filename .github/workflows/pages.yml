name: Publish FinRisk AI to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-lock.txt
      - run: npm --prefix frontend ci
      - run: python -m scripts.model_release restore
      - run: python -m scripts.report
      - run: python -m scripts.export_browser
      - run: ruff check invoice_risk scripts tests
      - run: python -m pytest -q
      - run: npm --prefix frontend run test:parity
      - run: npm --prefix frontend run build:pages
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm --prefix frontend run test:pages
        env:
          FINRISK_PYTHON: python
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
